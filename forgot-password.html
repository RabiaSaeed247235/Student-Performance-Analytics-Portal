<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Forgot password interface for the Student Performance Analytics Portal">
  <title>EduTrack Analytics | Forgot Password</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header"><nav class="navbar container" aria-label="Main navigation"><a class="brand" href="index.html"><span class="brand-mark">EA</span><span>EduTrack Analytics</span></a><button class="menu-toggle" type="button" aria-label="Toggle navigation" aria-expanded="false" aria-controls="nav-links">☰</button><ul class="nav-links" id="nav-links"><li><a href="index.html">Home</a></li><li><a href="dashboard.html">Dashboard</a></li><li><a class="active" href="login.html">Login</a></li><li><a href="register.html">Register</a></li></ul></nav></header>

  <main class="login-main">
    <section class="login-card" aria-labelledby="forgot-title">
      <div class="section-heading"><p class="eyebrow">Account Recovery</p><h1 id="forgot-title">Forgot password</h1><p>Enter a registered email to continue to the reset password interface.</p></div>
      <form id="forgot-password-form" class="form-grid" novalidate>
        <label>Email Address<input id="forgot-email" type="email" autocomplete="email" placeholder="name@example.com" required></label>
        <button class="btn btn-primary full-width" type="submit">Continue</button>
        <p class="form-message" id="forgot-password-message" role="status"></p>
      </form>
      <p class="auth-prompt"><a href="login.html">Back to login</a></p>
    </section>
  </main>

  <footer class="site-footer"><div class="container footer-content"><p>© 2026 EduTrack Analytics. Student Performance Analytics Portal.</p><div class="footer-links"><a href="about.html">About</a><a href="contact.html">Contact</a></div></div></footer>
  <script src="js/app.js"></script>
</body>
</html>
