<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Reset password interface for the Student Performance Analytics Portal">
  <title>EduTrack Analytics | Reset Password</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header"><nav class="navbar container" aria-label="Main navigation"><a class="brand" href="index.html"><span class="brand-mark">EA</span><span>EduTrack Analytics</span></a><button class="menu-toggle" type="button" aria-label="Toggle navigation" aria-expanded="false" aria-controls="nav-links">☰</button><ul class="nav-links" id="nav-links"><li><a href="index.html">Home</a></li><li><a href="dashboard.html">Dashboard</a></li><li><a href="login.html">Login</a></li><li><a href="register.html">Register</a></li></ul></nav></header>

  <main class="login-main">
    <section class="login-card" aria-labelledby="reset-title">
      <div class="section-heading"><p class="eyebrow">Account Recovery</p><h1 id="reset-title">Reset password</h1><p>Reset account: <strong id="reset-account">No account selected</strong></p></div>
      <form id="reset-password-form" class="form-grid" novalidate>
        <label>New Password<input id="reset-password" type="password" autocomplete="new-password" placeholder="Minimum 8 characters" minlength="8" required></label>
        <label>Confirm Password<input id="reset-confirm-password" type="password" autocomplete="new-password" placeholder="Repeat new password" minlength="8" required></label>
        <button class="btn btn-primary full-width" type="submit">Reset Password</button>
        <p class="form-message" id="reset-password-message" role="status"></p>
      </form>
      <p class="auth-prompt"><a href="forgot-password.html">Choose another account</a></p>
    </section>
  </main>

  <footer class="site-footer"><div class="container footer-content"><p>© 2026 EduTrack Analytics. Student Performance Analytics Portal.</p><div class="footer-links"><a href="about.html">About</a><a href="contact.html">Contact</a></div></div></footer>
  <script src="js/app.js"></script>
</body>
</html>
