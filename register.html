<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Register for the Student Performance Analytics Portal">
  <title>EduTrack Analytics | Register</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <nav class="navbar container" aria-label="Main navigation">
      <a class="brand" href="index.html"><span class="brand-mark">EA</span><span>EduTrack Analytics</span></a>
      <button class="menu-toggle" type="button" aria-label="Toggle navigation" aria-expanded="false" aria-controls="nav-links">☰</button>
      <ul class="nav-links" id="nav-links"><li><a href="index.html">Home</a></li><li><a href="dashboard.html">Dashboard</a></li><li><a href="reports.html">Reports</a></li><li><a href="login.html">Login</a></li><li><a class="active" href="register.html">Register</a></li></ul>
    </nav>
  </header>

  <main class="login-main">
    <section class="login-card" aria-labelledby="register-title">
      <div class="section-heading"><p class="eyebrow">Registration</p><h1 id="register-title">Create account</h1><p>User information is stored in Local Storage for front-end simulation.</p></div>
      <form id="register-form" class="form-grid" novalidate>
        <label>Full Name<input id="register-name" type="text" autocomplete="name" placeholder="Your full name" minlength="2" required></label>
        <label>Email Address<input id="register-email" type="email" autocomplete="email" placeholder="name@example.com" required></label>
        <label>User Role<select id="register-role" required><option value="student">Student</option><option value="teacher">Teacher</option><option value="administrator">Administrator</option></select></label>
        <label>Password<input id="register-password" type="password" autocomplete="new-password" placeholder="Minimum 8 characters" minlength="8" required></label>
        <label>Confirm Password<input id="register-confirm-password" type="password" autocomplete="new-password" placeholder="Repeat password" minlength="8" required></label>
        <button class="btn btn-primary full-width" type="submit">Register</button>
        <p class="form-message" id="register-message" role="status"></p>
      </form>
      <p class="auth-prompt">Already registered? <a href="login.html">Login here</a></p>
    </section>
  </main>

  <footer class="site-footer"><div class="container footer-content"><p>© 2026 EduTrack Analytics. Student Performance Analytics Portal.</p><div class="footer-links"><a href="about.html">About</a><a href="contact.html">Contact</a></div></div></footer>
  <script src="js/app.js"></script>
</body>
</html>
