<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<meta content="Reset password interface for the Student Performance Analytics Portal" name="description"/>
<title>EduTrack Analytics | Reset Password</title>
<link href="css/style.css" rel="stylesheet"/>
</head>
<body><a class="skip-link" href="#main-content">Skip to main content</a>
<header class="site-header"><nav aria-label="Main navigation" class="navbar container"><a class="brand" href="index.html"><span class="brand-mark">EA</span><span>EduTrack Analytics</span></a><button aria-controls="nav-links" aria-expanded="false" aria-label="Toggle navigation" class="menu-toggle" type="button">☰</button><ul class="nav-links" id="nav-links"><li><a href="index.html">Home</a></li><li><a href="dashboard.html">Dashboard</a></li><li><a href="login.html">Login</a></li><li><a href="register.html">Register</a></li></ul></nav></header>
<main class="login-main" id="main-content">
<section aria-labelledby="reset-title" class="login-card">
<div class="section-heading"><p class="eyebrow">Account Recovery</p><h1 id="reset-title">Reset password</h1><p>Reset account: <strong id="reset-account">No account selected</strong></p></div>
<form class="form-grid" id="reset-password-form" novalidate="">
<label>New Password<input aria-required="true" autocomplete="new-password" id="reset-password" minlength="8" placeholder="Minimum 8 characters" required="" type="password"/></label>
<label>Confirm Password<input aria-required="true" autocomplete="new-password" id="reset-confirm-password" minlength="8" placeholder="Repeat new password" required="" type="password"/></label>
<button class="btn btn-primary full-width" type="submit">Reset Password</button>
<p aria-live="polite" class="form-message" id="reset-password-message" role="status"></p>
</form>
<p class="auth-prompt"><a href="forgot-password.html">Choose another account</a></p>
</section>
</main>
<footer class="site-footer"><div class="container footer-content"><p>© 2026 EduTrack Analytics. Student Performance Analytics Portal.</p><div class="footer-links"><a href="about.html">About</a><a href="contact.html">Contact</a><a href="final-demo.html">Final Demo</a></div></div></footer>
<script defer="" src="js/app.js"></script>
</body>
</html>
